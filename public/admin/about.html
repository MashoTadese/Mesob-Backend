<!DOCTYPE html><html lang="en"><head><script>document.documentElement.setAttribute("data-theme",localStorage.getItem("mesob_admin_theme")||"light")</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MESOB Admin — About Us</title><link rel="stylesheet" href="admin-dark.css"><style>*{margin:0;padding:0;box-sizing:border-box}

.alert.success{background:#d1fae5;color:#059669;border:1px solid #a7f3d0}
.alert.error{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}
