<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MESOB Superadmin — Login</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0F1F5C,#1E3578);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
  .logo{text-align:center;margin-bottom:30px}
  .logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#1E3578,#2d4db0);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:bold;margin-bottom:12px;box-shadow:0 4px 15px rgba(30,53,120,0.4)}
  .logo h1{color:#1E3578;font-size:22px;font-weight:700}
  .logo p{color:#6b7280;font-size:13px;margin-top:4px}
  .form-group{margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
  input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:14px;outline:none;transition:border-color .2s}
  input:focus{border-color:#1E3578}
  .btn{width:100%;padding:14px;background:#1E3578;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;margin-top:8px}
  .btn:hover{background:#162b67}
  .error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
  .gold-bar{height:4px;background:linear-gradient(90deg,#F5C400,#FFE54D);border-radius:20px 20px 0 0;margin:-40px -40px 30px}
  .forgot-link{text-align:right;margin-top:8px}
  .forgot-link a{color:#1E3578;font-size:12px;text-decoration:none;font-weight:600}
  .forgot-link a:hover{text-decoration:underline}
  .success-msg{background:#f0fdf4;color:#059669;border:1px solid #a7f3d0;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
  .back-link{text-align:center;margin-top:12px}
  .back-link a{color:#6b7280;font-size:13px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="gold-bar"></div>
  <div class="logo">
    <div class="logo-icon">M</div>
    <h1>MESOB Superadmin</h1>
    <p>Sululta Branch Management</p>
  </div>
  <div class="error" id="error-msg"></div>
  <form id="loginForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="admin@mesob.gov.et" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn" id="loginBtn">Sign In</button>
    <div class="forgot-link"><a href="#" onclick="showForgotForm()">Forgot Password?</a></div>
  </form>

  <!-- Forgot Password Form -->
  <form id="forgotForm" style="display:none">
    <h3 style="font-size:16px;font-weight:700;color:#1E3578;margin-bottom:6px">Reset Password</h3>
    <p style="font-size:13px;color:#6b7280;margin-bottom:18px">Enter your admin email and we'll send a reset link.</p>
    <div class="error" id="forgot-error"></div>
    <div class="success-msg" id="forgot-success"></div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="resetEmail" placeholder="admin@mesob.gov.et" required>
    </div>
    <button type="submit" class="btn" id="forgotBtn">Send Reset Link</button>
    <div class="back-link"><a onclick="showLoginForm()">Back to Login</a></div>
  </form>
</div>
<script src="login.js"></script>
</body>
</html>
