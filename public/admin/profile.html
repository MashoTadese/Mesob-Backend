<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("mesob_admin_theme")||"light")</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MESOB Superadmin — Profile</title>
<link rel="stylesheet" href="admin-dark.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f4f6fb;color:#1F2937}
.sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:linear-gradient(180deg,#0F1F5C,#1E3578);color:#fff;display:flex;flex-direction:column;z-index:100}
.sidebar-logo{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,0.1)}
.sidebar-logo .icon{width:44px;height:44px;background:rgba(245,196,0,0.2);border:2px solid rgba(245,196,0,0.5);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;margin-bottom:8px}
.sidebar-logo h2{font-size:16px;font-weight:700}
.sidebar-logo p{font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px}
.gold-line{height:3px;background:linear-gradient(90deg,#F5C400,#FFE54D)}
nav{flex:1;padding:16px 0}
nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:rgba(255,255,255,0.75);text-decoration:none;font-size:14px;font-weight:500;transition:all .2s;border-left:3px solid transparent}
nav a:hover,nav a.active{background:rgba(255,255,255,0.1);color:#F5C400;border-left-color:#F5C400}
.main{margin-left:240px;min-height:100vh}
.topbar{background:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.topbar h1{font-size:18px;font-weight:700;color:#1E3578}
.logout-btn{background:#fee2e2;color:#dc2626;border:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.content{padding:28px;max-width:800px}
.card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;padding:28px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.card h2{font-size:16px;font-weight:700;color:#1E3578;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid #EEF1FB}
.avatar-section{display:flex;align-items:center;gap:24px;margin-bottom:8px}
.avatar-img{width:96px;height:96px;border-radius:50%;border:4px solid #EEF1FB;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:bold;color:#1E3578;overflow:hidden;flex-shrink:0}
.avatar-img img{width:100%;height:100%;object-fit:cover}
.avatar-info h3{font-size:18px;font-weight:700;color:#1F2937}
.avatar-info p{font-size:13px;color:#6b7280;margin-top:2px}
.upload-btn{display:inline-block;margin-top:10px;padding:8px 16px;background:#EEF1FB;color:#1E3578;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:2px dashed #c7d2fe;transition:all .2s}
.upload-btn:hover{background:#dde4ff}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
.form-group input{width:100%;padding:11px 14px;border:2px solid #e5e7eb;border-radius:10px;font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:#1E3578}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{padding:11px 24px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:#1E3578;color:#fff}
.alert{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:16px;display:none}
.alert.success{background:#d1fae5;color:#059669;border:1px solid #a7f3d0}
.alert.error{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}
.role-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:#FEF3C7;color:#D97706;margin-top:4px}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="icon">M</div>
    <h2>MESOB Superadmin</h2>
    <p>Sululta Branch</p>
  </div>
  <div class="gold-line"></div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="about.html">About Us</a>
    <a href="services-admin.html">Services</a>
    <a href="requirements-admin.html">Requirements</a>
    <a href="complaints.html">Complaints</a>
    <a href="faq-admin.html">FAQ</a>
    <a href="messages.html">Messages</a>
    <a href="news-admin.html">News</a>
    <a href="gallery-admin.html">Gallery</a>
    <a href="contact-admin.html">Contact Us</a>
    <a href="profile.html" class="active">Profile</a>
    <a href="settings.html">Settings</a>
    <a href="analytics.html">Analytics</a>
  </nav>
</div>
<div class="main">
  <div class="topbar">
    <h1 data-i18n="prof.title">My Profile</h1>
    <button class="logout-btn" onclick="logout()" data-i18n="btn.signout">Sign Out</button>
  </div>
  <div class="content">
    <div class="card">
      <h2 data-i18n="prof.picCard">Profile Picture</h2>
      <div class="avatar-section">
        <div class="avatar-img" id="avatarDisplay"><span id="avatarInitials">?</span></div>
        <div class="avatar-info">
          <h3 id="profileName">Loading...</h3>
          <p id="profileEmail"></p>
          <span class="role-badge" id="profileRole">Superadmin</span><br>
          <label class="upload-btn" for="avatarInput" data-i18n="prof.changePhoto">Change Photo</label>
          <input type="file" id="avatarInput" accept="image/*" style="display:none">
        </div>
      </div>
      <div class="alert" id="avatarAlert"></div>
    </div>
    <div class="card">
      <h2 data-i18n="prof.editCard">Edit Profile Information</h2>
      <div class="alert" id="profileAlert"></div>
      <form id="profileForm">
        <div class="form-grid">
          <div class="form-group"><label data-i18n="prof.fullName">Full Name *</label><input type="text" id="pName" required></div>
          <div class="form-group"><label data-i18n="prof.email">Email Address</label><input type="email" id="pEmail" disabled style="background:#f9fafb;cursor:not-allowed"></div>
          <div class="form-group"><label data-i18n="prof.phone">Phone Number</label><input type="tel" id="pPhone" placeholder="09xxxxxxxxx"></div>
          <div class="form-group"><label data-i18n="prof.position">Position / Title</label><input type="text" id="pPosition" placeholder="e.g. Branch Manager"></div>
        </div>
        <button type="submit" class="btn btn-primary" data-i18n="prof.saveBtn">Save Changes</button>
      </form>
    </div>
    <div class="card">
      <h2 data-i18n="prof.passCard">Change Password</h2>
      <div class="alert" id="passAlert"></div>
      <form id="passForm">
        <div class="form-group"><label data-i18n="prof.currentPass">Current Password *</label><input type="password" id="currentPass" placeholder="Enter current password" required></div>
        <div class="form-grid">
          <div class="form-group"><label data-i18n="prof.newPass">New Password *</label><input type="password" id="newPass" placeholder="Min 8 characters" required minlength="8"></div>
          <div class="form-group"><label data-i18n="prof.confirmPass">Confirm New Password *</label><input type="password" id="confirmPass" placeholder="Repeat new password" required></div>
        </div>
        <button type="submit" class="btn btn-primary" data-i18n="prof.changePassBtn">Change Password</button>
      </form>
    </div>
  </div>
</div>
<script src="profile.js"></script>
<script src="admin-prefs.js"></script>
</body>
</html>
