<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MESOB Superadmin  Reset Password</title><style>*{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0F1F5C,#1E3578);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
  .gold-bar{height:4px;background:linear-gradient(90deg,#F5C400,#FFE54D);border-radius:20px 20px 0 0;margin:-40px -40px 30px}
  .logo{text-align:center;margin-bottom:24px}
  .logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#1E3578,#2d4db0);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:bold;margin-bottom:12px}
  .logo h1{color:#1E3578;font-size:22px;font-weight:700}
  .logo p{color:#6b7280;font-size:13px;margin-top:4px}
  .form-group{margin-bottom:18px;position:relative}
  label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
  input{width:100%;padding:12px 40px 12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:14px;outline:none;transition:border-color .2s}
  input:focus{border-color:#1E3578}
  .toggle-pw{position:absolute;right:14px;top:38px;cursor:pointer;color:#9ca3af;font-size:14px;user-select:none}
  .toggle-pw:hover{color:#1E3578}
  .strength{height:4px;border-radius:4px;margin-top:6px;transition:all .3s;background:#e5e7eb}
  .strength-text{font-size:11px;color:#6b7280;margin-top:3px}
  .btn{width:100%;padding:14px;background:#1E3578;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;margin-top:8px}
  .btn:hover{background:#162b67}
  .btn:disabled{background:#9ca3af;cursor:not-allowed}
  .error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
  .success{background:#f0fdf4;color:#059669;border:1px solid #a7f3d0;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
  .invalid-token{text-align:center;display:none}
  .invalid-token p{color:#dc2626;font-weight:600;margin-bottom:12px}
  a.back-link{display:inline-block;margin-top:16px;text-align:center;width:100%;font-size:13px;color:#6b7280;text-decoration:none}
  a.back-link:hover{color:#1E3578}
</style></head><body><div class="card"><div class="gold-bar"></div><div class="logo"><div class="logo-icon">M</div><h1>MESOB Superadmin</h1><p>Set a new password</p></div><div class="invalid-token" id="invalidToken"><p>This reset link is invalid or has expired.</p><p style="color:#6b7280;font-size:13px;margin-bottom:16px">Please request a new password reset link.</p><a href="login.html" class="btn" style="display:block;text-align:center;text-decoration:none">Back to Login</a></div><div id="resetFormContainer"><div class="error"   id="error-msg"></div><div class="success" id="success-msg"></div><form id="resetForm"><div class="form-group"><label>New Password</label><input type="password" id="newPassword" placeholder="Minimum 8 characters" required oninput="checkStrength(this.value)"><span class="toggle-pw" onclick="togglePw('newPassword',this)"></span><div class="strength" id="strengthBar"></div><div class="strength-text" id="strengthText"></div></div><div class="form-group"><label>Confirm New Password</label><input type="password" id="confirmPassword" placeholder="Re-enter your new password" required><span class="toggle-pw" onclick="togglePw('confirmPassword',this)"></span></div><button type="submit" class="btn" id="resetBtn">Set New Password</button></form><a href="login.html" class="back-link">Back to Login</a></div></div><script>// Get token from URL
  var token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('resetFormContainer').style.display = 'none';
    document.getElementById('invalidToken').style.display = 'block';
  }

  function togglePw(id, el) {
    var input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    el.textContent = input.type === 'password' ? '' : '';
  }

  function checkStrength(val) {
    var bar  = document.getElementById('strengthBar');
    varText = document.getElementById('strengthText');
    if (!val) { bar.style.width='0';Text.textContent=''; return; }
    var score = 0;
    if (val.length >= 8)  score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    var colors = ['#ef4444','#f97316','#eab308','#22c55e'];
    var labels = ['Weak','Fair','Good','Strong'];
    bar.style.width = (score * 25) + '%';
    bar.style.background = colors[score-1] || '#e5e7eb';
  Text.textContent = score >0 ? labels[score-1] : '';
  }

  document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn      = document.getElementById('resetBtn');
    var errEl    = document.getElementById('error-msg');
    var succEl   = document.getElementById('success-msg');
    var password = document.getElementById('newPassword').value;
    var confirm  = document.getElementById('confirmPassword').value;

    errEl.style.display  = 'none';
    succEl.style.display = 'none';

    if (password !== confirm) {
      errEl.textContent = 'Passwords do not match.';
      errEl.style.display = 'block';
      return;
    }
    if (password.length < 8) {
      errEl.textContent = 'Password must be at least 8 characters.';
      errEl.style.display = 'block';
      return;
    }

    btn.textContent = 'Resetting...';
    btn.disabled    = true;

    try {
      var res  = await fetch(window.location.origin + '/api/admin/reset-password', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ token, password, confirmPassword: confirm }),
      });
      var data = await res.json();
      if (data.success) {
        succEl.textContent = ' ' + data.message;
        succEl.style.display = 'block';
        document.getElementById('resetForm').style.display = 'none';
        setTimeout(function() { window.location.href = 'login.html'; }, 2500);
      } else {
        errEl.textContent = data.message || 'Reset failed.';
        errEl.style.display = 'block';
        if (data.message && data.message.includes('expired')) {
          document.getElementById('resetFormContainer').style.display = 'none';
          document.getElementById('invalidToken').style.display = 'block';
        }
      }
    } catch (err) {
      errEl.textContent = 'Network error: ' + err.message;
      errEl.style.display = 'block';
    } finally {
      btn.textContent = 'Set New Password';
      btn.disabled    = false;
    }
  });
</script></body></html>
